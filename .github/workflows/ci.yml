# Comprobaciones obligatorias: si alguna falla, el PR queda en rojo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Formato, lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fijadas por SHA completo (no por etiqueta, que puede moverse): seguridad de la cadena de suministro
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Instala la versión de pnpm fijada en "packageManager" de package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias (exactas del lockfile)
        run: pnpm install --frozen-lockfile

      - name: Biome (formato y lint, sin escribir)
        run: pnpm biome ci --reporter=github

      - name: Tipos (astro check)
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
